<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracias | Autopilot</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23060608'/%3E%3Cpath d='M18 40h28' stroke='%23c8f135' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M32 18v28' stroke='%23c8f135' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #060608;
      color: #f4f2ee;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      padding: 40px 24px;
      text-align: center;
      background-image:
        radial-gradient(ellipse 50% 40% at 50% 20%, rgba(200,241,53,0.08) 0%, transparent 60%);
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
      text-decoration: none;
      color: #f4f2ee;
      margin-bottom: 48px;
    }
    .logo span { color: #c8f135; }
    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 5vw, 3.2rem);
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin-bottom: 16px;
    }
    p {
      color: #b9b6af;
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 36ch;
      margin: 0 auto 36px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    a.btn {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 4px;
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
    }
    a.btn:hover { transform: translateY(-2px); }
    a.primary {
      background: #c8f135;
      color: #060608;
    }
    a.primary:hover { background: #8bffd6; }
    a.secondary {
      border: 1px solid rgba(255,255,255,0.12);
      color: #f4f2ee;
    }
    a.secondary:hover {
      border-color: rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.03);
    }
  </style>
</head>
<body>
  <a class="logo" href="/">Autopilot<span>.</span></a>
  <h1>Recibimos tu consulta</h1>
  <p>Te vamos a responder a la brevedad con un enfoque inicial de qué se puede automatizar.</p>
  <div class="actions">
    <a class="btn primary" href="/">Volver al inicio</a>
    <a class="btn secondary" href="/#probar">Armar otro ejemplo</a>
  </div>
</body>
</html>
